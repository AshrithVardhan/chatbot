<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium AI chatbot powered by Groq — blazing fast inference, intelligent, and beautiful." />
    <title>Groq Chat — Blazing Fast AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Animated background -->
      <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                  <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#a78bfa"/>
                    <stop offset="1" stop-color="#60a5fa"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
            <span class="logo-text">Groq Chat</span>
          </div>
          <button class="sidebar-toggle-close" id="sidebarClose" aria-label="Close sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          New Chat
        </button>

        <div class="sidebar-section-label">Recent</div>
        <div class="chat-history" id="chatHistory">
          <!-- History items injected by JS -->
        </div>

        <div class="sidebar-footer">
          <div class="model-badge">
            <div class="model-dot"></div>
            <span>groq/compound</span>
          </div>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="chat-main">
        <!-- Top bar -->
        <header class="topbar">
          <button class="sidebar-toggle-open" id="sidebarOpen" aria-label="Open sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title">
            <span id="chatTitle">New Conversation</span>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="clearBtn" title="Clear chat">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </header>

        <!-- Messages -->
        <div class="messages-wrapper" id="messagesWrapper">
          <div class="messages" id="messages">
            <!-- Welcome screen -->
            <div class="welcome-screen" id="welcomeScreen">
              <div class="welcome-glow"></div>
              <div class="welcome-icon">
                <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
                  <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#wGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <defs>
                    <linearGradient id="wGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#a78bfa"/>
                      <stop offset="1" stop-color="#60a5fa"/>
                    </linearGradient>
                  </defs>
                </svg>
              </div>
              <h1 class="welcome-title">Hello, I'm Groq</h1>
              <p class="welcome-sub">Blazing fast AI powered by Groq. Ask me anything — I respond at lightning speed.</p>
              <div class="suggestion-grid">
                <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms">
                  <span class="suggestion-icon">⚛️</span>
                  <span>Explain quantum computing in simple terms</span>
                </button>
                <button class="suggestion-card" data-prompt="Write a Python function to reverse a linked list">
                  <span class="suggestion-icon">🐍</span>
                  <span>Write a Python function to reverse a linked list</span>
                </button>
                <button class="suggestion-card" data-prompt="Give me 5 tips to improve my productivity">
                  <span class="suggestion-icon">🚀</span>
                  <span>Give me 5 tips to improve my productivity</span>
                </button>
                <button class="suggestion-card" data-prompt="What are the key differences between REST and GraphQL?">
                  <span class="suggestion-icon">🌐</span>
                  <span>Differences between REST and GraphQL</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
          <div class="input-container">
            <textarea
              id="messageInput"
              placeholder="Message Gemini…"
              rows="1"
              aria-label="Message input"
            ></textarea>
            <div class="input-actions">
              <span class="char-count" id="charCount"></span>
              <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
          <p class="input-disclaimer">Gemini can make mistakes. Verify important information.</p>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
